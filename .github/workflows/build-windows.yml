# Construit l'installeur Windows à chaque envoi de code.
# Si la version de package.json n'a encore jamais été publiée, crée une « Release » GitHub :
# l'appli installée la détecte et se met à jour toute seule.
name: Installeur Windows et appli téléphone

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Construire l'installeur
        run: npx electron-builder --win nsis --publish never

      - name: Vérifier les fichiers de mise à jour
        shell: bash
        run: |
          ls -la dist
          test -f dist/latest.yml
          cat dist/latest.yml

      - uses: actions/upload-artifact@v4
        with:
          name: Mon-Planning-Installeur
          path: dist/*.exe
          retention-days: 30

      - name: Publier la nouvelle version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "La version $version est déjà publiée : rien à faire."
            exit 0
          fi
          git log -1 --pretty=%B | sed '/^Co-Authored-By:/d;/^Claude-Session:/d' > notes.md
          gh release create "v$version" \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml \
            --target "$GITHUB_SHA" \
            --title "Mon Planning $version" \
            --notes-file notes.md

  # Appli téléphone : construite puis publiée sur la branche gh-pages (GitHub Pages)
  web:
    runs-on: ubuntu-latest
    env:
      # Electron n'est pas nécessaire pour construire l'appli téléphone
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build:web

      - name: Publier l'appli téléphone
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-web
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Appli téléphone (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
